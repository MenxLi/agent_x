<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffefa">
  <title>Sign in - Xun</title>
  <style>
    :root { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #222925; background: #edf0ed; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: linear-gradient(#edf0ed 1px, transparent 1px); background-size: 100% 30px; }
    main { width: min(360px, 100%); padding: 28px; border: 1px solid #c5cec8; border-radius: 8px; background: #fffefa; box-shadow: 0 18px 50px rgba(34, 41, 37, .12); }
    h1 { margin: 0 0 6px; font: 600 28px/1.1 Georgia, serif; }
    p { margin: 0 0 22px; color: #6d7771; font: 13px/1.5 sans-serif; }
    label { display: block; margin-bottom: 7px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    input { width: 100%; height: 42px; padding: 0 11px; border: 1px solid #c5cec8; border-radius: 5px; background: white; font: inherit; }
    input:focus { outline: 2px solid #176c62; outline-offset: 2px; }
    button { width: 100%; height: 42px; margin-top: 12px; border: 0; border-radius: 5px; color: white; background: #176c62; font: 700 13px sans-serif; cursor: pointer; }
    button:hover { background: #10544d; }
    .error { margin: 10px 0 0; color: #b3423d; font-size: 11px; }
  </style>
</head>
<body>
  <main>
    <h1>Xun</h1>
    <p>Enter the service access token.</p>
    <form method="post" action="{{ action }}">
      <input type="hidden" name="next" value="{{ target }}">
      <label for="token">Access token</label>
      <input id="token" name="token" type="password" required autofocus autocomplete="current-password">
      <button type="submit">Sign in</button>
      {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    </form>
  </main>
</body>
</html>
